# The layer arrows in rule 5 of CLAUDE.md, written as contracts import-linter
# can check. Nothing here is a style opinion. Every contract below is one of
# rule 5's own sentences, and adding one that rule 5 does not say makes this
# file an argument rather than a gate.
#
# Two root packages, because that is what Python this repository has. The names
# are what the interpreter calls them rather than what a reader would pick:
# services/api/app/__init__.py makes the members API importable as `app`, and
# services/door/__init__.py makes the door service importable as `door`. Their
# parent directories differ, so tools/import-boundaries/run.sh puts both of
# them on PYTHONPATH.
#
# What is deliberately not here:
#
#   apps/                  no Python. `git ls-files 'apps/**/*.py'` returns
#                          nothing on 2026-08-29, so a contract naming it would
#                          name a module that does not exist. Rule 10.
#   packages/              seven Python files, all of them under
#                          packages/gantry-tokens/validator/, which checks the
#                          contrast of every ink token in tokens.css. None of
#                          the seven is in a package: there is no __init__.py,
#                          and each file puts its own directory on sys.path and
#                          imports its siblings by bare name, so the
#                          interpreter knows them as `cascade`, `contrast` and
#                          `check_contrast` rather than as anything under
#                          packages/. Two things follow. import-linter refuses
#                          a bare module as a root package, answering
#                          "'cascade' is a module, not a package", measured on
#                          2026-08-29, so those names cannot go on the list
#                          below as they stand. And the arrow rule 5 draws from
#                          packages/ down to services/ has nothing to hold here
#                          yet: the validator imports the standard library and
#                          the other files beside it, and reaches nothing else.
#                          The day it imports anything outside its own
#                          directory is the day it needs an __init__.py and a
#                          place on that list.
#   the index rule         rule 5 says a package exports through its index.
#                          Writing it here would fail the tree it is written
#                          over. services/door/adapters/base.py imports
#                          ..domain.slots rather than ..domain, and wire.py,
#                          controller.py and slot_range.py under
#                          adapters/oac_ethernet do the same. Holding the rule
#                          means changing those imports first, which is a
#                          decision about the door service and not about this
#                          file.
#   no cycles              import-linter can express it. Rule 5 does not ask
#                          for it, and a gate that checks more than the rule is
#                          a gate somebody argues with.

[importlinter]
# The width of the graph, and the one thing about this gate worth knowing at
# 2am. import-linter starts at these names and follows imports from there. A
# module outside all of them is not a node, so a chain that passes through it
# is invisible. Measured on 2026-08-29 in a copy of this tree:
# services/shared_wire.py importing door.adapters.oac_ethernet.wire, and
# services/api/app/door_gateway.py importing shared_wire, gave
# "Contracts: 2 kept, 0 broken" and exit 0, while the same image running
# `python -c "import app.door_gateway"` left the door service in sys.modules.
#
# tools/import-boundaries/check_root_packages.py holds that shut. It reads
# every absolute import in the packages named here and refuses any top level
# name that a directory on the gate's PYTHONPATH provides while this list does
# not declare it. Adding the name is the fix and it works: the same tree with
# services/shared/ as a package and `shared` on this list reported the contract
# broken and named both hops, app.door_gateway -> shared.wire and
# shared.wire -> door.adapters.wire.
root_packages =
    app
    door

# Rule 5: "The API layer never speaks the door wire protocol. It calls the door
# service." Independence rather than a one way ban, because the arrow does not
# exist in either direction. The two are separate processes on separate
# networks: the door service is the only thing that holds the controller
# password and the only thing that opens a socket to the controller, so an
# import between them is a process boundary being crossed in the one way that
# leaves no trace in compose.yaml.
#
# import-linter reads a real graph, so the module that crosses the line does not
# have to be the one anybody opened. ADR 0006 rejected ruff's TID rules over the
# narrower case they miss, which is a crossing import written in a file their
# config does not cover.
[importlinter:contract:the-api-does-not-speak-the-wire]
name = The members API and the door service do not import each other
type = independence
modules =
    app
    door
broken_contract_guidance = Rule 5 of CLAUDE.md. The API calls the door service over HTTP and never imports it, because the door service holds the controller password and owns the socket. Whatever was reached for here belongs in the door service's own HTTP API, or in a shared type that neither of them owns. Do not add an ignore_imports line for it.

# The open question ADR 0006 left, answered. The door service should have this
# contract, and the reason is the decision recorded in HANDOFF.md section 4:
# the door service is an API plus a controller adapter so the Arduino can be
# replaced without the contract changing. That only stays true while the domain
# knows nothing about any adapter. The arrow already points this way in the
# code, so the contract holds what is there rather than asking for a change.
#
# Against it, ADR 0006 said a gate installed for one package teaches nobody the
# shape of the whole. That argument expires here: services/api exists now, both
# packages are in this file, and the shape of the whole is the two contracts
# read together.
[importlinter:contract:the-door-domain-knows-no-adapter]
name = The door service's domain does not import its adapters
type = layers
containers =
    door
layers =
    adapters
    domain
broken_contract_guidance = Rule 5 of CLAUDE.md. domain holds the slot arithmetic and the reconcile plan, and it has to stay readable without knowing what is on the other end of the wire. An adapter imports domain. Never the other way. If domain needs something an adapter has, the thing it needs is a value, and the adapter should hand it over rather than the domain reaching for it.
